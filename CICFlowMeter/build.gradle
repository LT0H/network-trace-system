// 适配Gradle 8.14.3 + JDK11/21（兼容Java 1.8编译）
plugins {
    id 'java' // 核心Java插件
    id 'application' // 应用程序插件
    id 'distribution' // 分发打包插件
    id 'maven-publish' // 替换旧版maven插件（Gradle 8+推荐）
}

group = 'cic.unb.ca'
version = '4.0'
description = 'CICFlowMeterV4'

// 统一Java版本（编译为1.8兼容，运行兼容JDK11/21）
java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
    toolchain {
        languageVersion = JavaLanguageVersion.of(11) // 匹配当前Daemon的JDK11（或改为21）
    }
}

// 仓库配置（优先国内镜像，加速依赖下载）
repositories {
    mavenLocal()
    maven { url 'https://maven.aliyun.com/repository/public/' } // 阿里云镜像
    mavenCentral()
    maven { url "https://clojars.org/repo" }
    maven { url "https://mvnrepository.com/artifact/org.jnetpcap/jnetpcap" }
}

// 依赖配置（替换compile为implementation，解决Gradle 8+兼容）
dependencies {
    // 核心依赖
    implementation 'org.apache.logging.log4j:log4j-core:2.11.0'
    implementation 'org.slf4j:slf4j-log4j12:1.7.25'
    implementation 'junit:junit:4.12'
    implementation 'org.apache.commons:commons-lang3:3.6'
    implementation 'org.apache.commons:commons-math3:3.5'
    implementation 'commons-io:commons-io:2.5'
    implementation 'nz.ac.waikato.cms.weka:weka-stable:3.6.14'
    implementation 'org.jfree:jfreechart:1.5.0'
    implementation 'com.google.guava:guava:23.6-jre'
    implementation 'org.apache.tika:tika-core:1.17'
    
    // jnetpcap依赖（Windows 64位专用，解决DLL依赖）
    implementation 'org.jnetpcap:jnetpcap:1.4.1:windows-amd64'
    
    // 测试依赖
    testImplementation 'junit:junit:4.12'
}

// 源码目录配置
sourceSets {
    main {
        java {
            srcDir 'src'
            exclude '**/CICFlowMeter.java'
        }
        resources {
            srcDirs 'jnetpcap' // 包含jnetpcap的DLL文件
        }
    }
}

// 生成可执行FatJar（包含所有依赖）
task fatJar(type: Jar) {
    archiveBaseName = 'CICFlowMeter-all'
    archiveVersion = '4.0'
    archiveExtension = 'jar'

    manifest {
        attributes(
            'Main-Class': 'cic.cs.unb.ca.ifm.App', // GUI主类
            'Cmd-Main-Class': 'cic.cs.unb.ca.ifm.Cmd', // 命令行主类
            'Implementation-Version': version,
            'Class-Path': configurations.runtimeClasspath.files.collect { it.name }.join(' ')
        )
    }

    // 打包所有依赖到JAR
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    with jar
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE // 忽略重复文件
}

// 生成Windows批处理脚本（简化命令行调用）
task createBatScript {
    doLast {
        def batContent = """@echo off
:: CICFlowMeter批处理脚本（适配Windows+JDK11/21）
setlocal enabledelayedexpansion
set "JAVA_EXE=java"
:: 强制使用指定JDK（可选，替换为用户的Java 21路径）
:: set "JAVA_EXE=C:\\Program Files\\Java\\jdk-21.0.9\\bin\\java.exe"

:: 检查JRE
!JAVA_EXE! -version >nul 2>&1 || (
    echo 错误：未找到Java运行环境，请安装JDK11+并配置环境变量
    pause
    exit /b 1
)

:: 运行CICFlowMeter（参数1=PCAP文件路径，参数2=输出目录）
!JAVA_EXE! -Djava.library.path=jnetpcap/win/jnetpcap-1.4.r1425 -jar "%~dp0CICFlowMeter-all-4.0.jar" %1 %2

endlocal
exit /b 0
"""
        // 写入批处理文件到build/libs
        def batFile = new File("${buildDir}/libs/CICFlowMeter.bat")
        batFile.write(batContent, 'GBK') // 适配Windows中文编码
        println "已生成批处理脚本：${batFile.absolutePath}"
    }
}

// 应用程序配置（GUI主类）
application {
    mainClass = 'cic.cs.unb.ca.ifm.App'
    applicationDefaultJvmArgs = ["-Djava.library.path=jnetpcap/win/jnetpcap-1.4.r1425"]
}

// 分发配置（打包JAR+DLL+脚本）
distributions {
    main {
        contents {
            from(fatJar)
            from('jnetpcap') // 包含jnetpcap的DLL文件
            from('LICENSE.txt')
            from('ReadMe.txt') { rename 'ReadMe.txt', 'README.md' }
        }
    }
}

// 编译任务依赖（先打JAR，再生成脚本）
build.dependsOn fatJar, createBatScript

// 兼容旧版zip任务（可选）
task zipSrc(type: Zip) {
    archiveBaseName = "${applicationName}-Source"
    destinationDirectory = file('build/')
    from('.') {
        include '**/*'
        exclude '.gradle/', 'build/', 'bin/', 'logs/', '*.iml', '*.ipr', '*.iws', '.idea/', 'out/', 'data/'
        into "${applicationName}V${version}-Src"
    }
}