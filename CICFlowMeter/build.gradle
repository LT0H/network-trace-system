// 插件声明（Gradle 8+ 推荐使用 plugins 块）
plugins {
    id 'java'
    id 'maven-publish'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'  // 兼容 Gradle 8
}

// JDK 21 工具链配置（强制使用 JDK 21）
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    // 禁用孵化特性警告（Gradle 8+ 兼容）
    disableAutoTargetJvm()
}

// 编译选项（适配 JDK 21）
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.release = 21  // 编译为 Java 21 字节码
    // 兼容旧代码的参数（若有需要）
    options.compilerArgs += ['--add-opens', 'java.base/java.lang=ALL-UNNAMED']
}

// 测试选项
tasks.withType(Test) {
    useJUnit()  // 显式指定 JUnit 版本兼容
    jvmArgs += ['--add-opens', 'java.base/java.lang=ALL-UNNAMED']
}

// 项目信息
group = 'cic.unb.ca'
version = '4.0'
description = 'CICFlowMeterV4'

// 依赖仓库（补充 jnetpcap 可能的仓库）
repositories {
    mavenLocal()  // 优先本地仓库（手动安装的依赖在这里）
    maven { url "https://maven.aliyun.com/repository/public" }
    maven { url "https://maven.aliyun.com/repository/central" }
    mavenCentral()
    maven { url "https://clojars.org/repo" }
    // 补充 jnetpcap 可能的仓库
    maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
}

// 依赖配置（适配 JDK 21，移除冲突依赖）
dependencies {
    // 日志依赖（升级到兼容 JDK 21 的版本）
    implementation group: 'org.apache.logging.log4j', name: 'log4j-core', version: '2.23.1'
    implementation group: 'org.slf4j', name: 'slf4j-log4j12', version: '2.0.9'
    // 抓包依赖（已手动安装到本地仓库）
    implementation group: 'net.sourceforge.jpcap', name: 'jpcap', version: '0.7'
    implementation group: 'org.jnetpcap', name: 'jnetpcap', version: '1.4.r1425'
    // 工具类依赖（升级到兼容 JDK 21）
    implementation group: 'com.google.guava', name: 'guava', version: '32.1.3-jre'
    // 测试依赖
    testImplementation group: 'junit', name: 'junit', version: '4.13.2'
}

// 源代码目录
sourceSets {
    main {
        java {
            srcDir 'src'
        }
    }
}

// 应用程序入口（确保与实际主类路径一致）
mainClassName = 'ca.unb.cic.flowmeter.Main'

// Shadow 插件配置（生成可执行胖 JAR）
shadowJar {
    archiveBaseName = 'CICFlowMeter-4.0'
    archiveClassifier = ''
    archiveVersion = ''
    mainClassName = 'ca.unb.cic.flowmeter.Main'
    // 合并服务文件（避免依赖冲突）
    mergeServiceFiles()
}

// 构建时自动执行 shadowJar
build.dependsOn(shadowJar)