<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>创建任务 - 网络监控系统</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-group { margin: 15px 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 50%; padding: 8px; box-sizing: border-box; }
        .btn-submit { background-color: #4CAF50; color: white; border: none; padding: 10px 20px; cursor: pointer; }
        .error { color: red; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>创建网络监控任务</h1>
    <a href="{% url 'task_list' %}">返回任务列表</a>
    
    {% if messages %}
        {% for message in messages %}
            <div class="error">{{ message }}</div>
        {% endfor %}
    {% endif %}
    
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="name">任务名称：</label>
            <input type="text" id="name" name="name" required placeholder="例如：扫描192.168.1.1">
        </div>
        <div class="form-group">
            <label for="task_type">任务类型：</label>
            <select id="task_type" name="task_type" required>
                <option value="scan">端口扫描</option>
                <option value="traffic">流量分析</option>
                <option value="anomaly">异常检测</option>
            </select>
        </div>
        <div class="form-group">
            <label for="target">目标（IP/网段）：</label>
            <input type="text" id="target" name="target" required placeholder="例如：192.168.1.1 或 192.168.1.0/24">
        </div>
        <div class="form-group">
            <button type="submit" class="btn-submit">创建任务</button>
        </div>
    </form>
</body>
</html>
