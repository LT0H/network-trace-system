plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(11)
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.release = 11
    options.compilerArgs << "-Xlint:deprecation" << "-Xlint:unchecked"
}

group = 'cic.unb.ca'
version = '4.0'
description = 'CICFlowMeter 100% Zero-Dependency Core'

// 仅本地仓库（零远程依赖）
repositories {
    mavenLocal()
}

// 零依赖（无任何第三方库）
dependencies {
}

// 只编译改写后的核心文件，排除所有其他冗余代码
sourceSets {
    main {
        java {
            srcDir 'src/main/java'
            // 仅保留核心文件（FlowMgr.java 和 Cmd.java），不写 exclude 避免冲突
            include 'cic/cs/unb/ca/flow/FlowMgr.java'
            include 'cic/cs/unb/ca/ifm/Cmd.java'
            // 移除这行！之前的 exclude 导致所有文件被排除
            // exclude '**/*'
        }
    }
}

// 主类指向改写后的 Cmd.java
mainClassName = 'cic.cs.unb.ca.ifm.Cmd'

// 生成零依赖胖JAR
shadowJar {
    archiveBaseName = 'CICFlowMeter-ZeroDep'
    archiveClassifier = ''
    archiveVersion = ''
    mainClassName = 'cic.cs.unb.ca.ifm.Cmd'
}

build.dependsOn shadowJar